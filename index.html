<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poland Inventory Radar</title>
<style>
:root{--bg:#0b1020;--card:#121a2c;--line:#26324a;--txt:#eef3ff;--muted:#9aabc8;--good:#4ade80;--warn:#fbbf24;--blue:#60a5fa;--offer:#f59e0b;--bad:#fb7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{padding:24px;border-bottom:1px solid var(--line);background:#0e1528}h1{margin:0 0 6px;font-size:25px}.muted{color:var(--muted)}main{max-width:1400px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}.tabs button.active{border-color:var(--blue)}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:700}.strong{color:var(--good)}.watch{color:var(--warn)}.offer{color:var(--offer)}table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-size:12px}a{color:#93c5fd}input{width:100%;max-width:420px;background:#0f172a;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:14px}.pill{display:inline-block;margin:2px 4px 2px 0;padding:3px 7px;border-radius:999px;background:#0e1627;border:1px solid var(--line);color:var(--muted);font-size:11px}.pricebox{line-height:1.55}.pricebox .usd{color:#bfdbfe}.pricebox .pln{color:#bbf7d0}.offerbox{border-left:3px solid var(--offer);padding-left:8px}.maxbox{border-left:3px solid var(--bad);padding-left:8px}@media(max-width:700px){.tablewrap{overflow-x:auto}th,td{min-width:120px}}
</style>
</head><body>
<header><h1>Poland Inventory Radar</h1><div class="muted">Eastern/Central Europe → Poland consolidation → U.S. reseller-auction sourcing intelligence</div></header>
<main>
<div class="tabs"><button class="active" data-tab="buy">Buy List</button><button data-tab="opp">Live Opportunities</button><button data-tab="offers">Offer Opportunities</button><button data-tab="sources">Source Markets</button></div>
<input id="search" placeholder="Filter categories, listings, offers, sites…">
<section id="buy" class="panel active"><div id="buyGrid" class="grid"></div></section>
<section id="opp" class="panel"><div class="tablewrap"><table><thead><tr><th>Score</th><th>Status</th><th>Listing</th><th>Price — Local / USD / PLN</th><th>Why it matters</th><th>Checked</th></tr></thead><tbody id="oppBody"></tbody></table></div></section>
<section id="offers" class="panel"><div class="tablewrap"><table><thead><tr><th>Score if accepted</th><th>Listing</th><th>Asking price</th><th>Send offer</th><th>Walk-away max</th><th>Why offer</th><th>Checked</th></tr></thead><tbody id="offerBody"></tbody></table></div></section>
<section id="sources" class="panel"><div id="sourceGrid" class="grid"></div></section>
</main>
<script>
let datasets={buy:[],opp:[],offers:[],sources:[]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const triple=(local,usd,pln,cls='')=>`<div class="pricebox ${cls}"><b>${esc(local||'—')}</b><br><span class="usd">${esc(usd||'')}</span><br><span class="pln">${esc(pln||'')}</span></div>`;
async function load(){
  const [buy,opp,offers,sources]=await Promise.all(['data/buy-list.json','data/opportunities.json','data/offer-opportunities.json','data/sources.json'].map(x=>fetch(x).then(r=>r.json())));
  datasets={buy,opp,offers,sources};render();
}
function render(){const q=document.querySelector('#search').value.toLowerCase();
 document.querySelector('#buyGrid').innerHTML=datasets.buy.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).map(x=>`<article class="card"><span class="badge strong">${esc(x.priority)}</span><h3>${esc(x.category)}</h3><p><b>Target buy:</b> ${esc(x.target_buy_price_local)}<br><b>Max buy:</b> ${esc(x.max_buy_price_local)}<br><b>U.S. target:</b> ${esc(x.good_us_sold_band_usd)}<br><b>Shipping:</b> ${esc(x.shipping_grade)}</p><div>${(x.what_to_seek||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div>${x.fx_date?`<p class="muted">FX conversion: ${esc(x.fx_date)}</p>`:''}</article>`).join('');
 document.querySelector('#oppBody').innerHTML=datasets.opp.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).map(x=>`<tr><td><b>${esc(x.score)}</b></td><td><span class="badge ${x.status.includes('STRONG')?'strong':'watch'}">${esc(x.status)}</span></td><td><a href="${esc(x.source_url)}" target="_blank">${esc(x.title)}</a><br><span class="muted">${esc(x.source)} · ${esc(x.country)}</span></td><td><div class="pricebox"><b>${esc(x.source_price)}</b><br><span class="usd">${esc(x.source_price_usd||'')}</span><br><span class="pln">${esc(x.source_price_pln||'')}</span>${x.unit_cost&&x.unit_cost!==x.source_price?`<br><span class="muted">Unit: ${esc(x.unit_cost)}${x.unit_cost_usd?` · ${esc(x.unit_cost_usd)}`:''}${x.unit_cost_pln?` · ${esc(x.unit_cost_pln)}`:''}</span>`:''}${x.fx_date?`<br><span class="muted">FX ${esc(x.fx_date)}</span>`:''}</div></td><td>${esc(x.why)}<br><span class="muted">${esc(x.notes)}</span></td><td>${esc(x.checked)}</td></tr>`).join('');
 document.querySelector('#offerBody').innerHTML=datasets.offers.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).map(x=>`<tr><td><b>${esc(x.score_if_accepted)}</b><br><span class="badge offer">${esc(x.status)}</span></td><td><a href="${esc(x.source_url)}" target="_blank">${esc(x.title)}</a><br><span class="muted">${esc(x.source)} · ${esc(x.country)}</span><br><span class="muted">${esc(x.category)}</span></td><td>${triple(x.asking_price_local,x.asking_price_usd,x.asking_price_pln)}</td><td>${triple(x.suggested_offer_local,x.suggested_offer_usd,x.suggested_offer_pln,'offerbox')}<span class="muted">${esc(x.offer_discount_from_ask)} below ask<br>${esc(x.offer_channel)}</span></td><td>${triple(x.walk_away_max_local,x.walk_away_max_usd,x.walk_away_max_pln,'maxbox')}<span class="muted">Do not exceed</span></td><td>${esc(x.why_offer)}<br><span class="muted">${esc(x.source_side_cost_note)}</span><br><span class="muted">${esc(x.notes)}</span></td><td>${esc(x.checked)}${x.fx_date?`<br><span class="muted">FX ${esc(x.fx_date)}</span>`:''}</td></tr>`).join('');
 document.querySelector('#sourceGrid').innerHTML=datasets.sources.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).map(x=>`<article class="card"><span class="badge">${esc(x.priority)}</span><h3><a href="${esc(x.url)}" target="_blank">${esc(x.site)}</a></h3><div class="muted">${esc(x.country)}</div><p>${esc(x.notes)}</p><div>${(x.search_terms||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div></article>`).join('');
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#'+b.dataset.tab).classList.add('active')});
document.querySelector('#search').addEventListener('input',render);load();
</script></body></html>
